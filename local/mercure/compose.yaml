services:
  mercure:
    image: dunglas/mercure:latest
    container_name: ember-mercure-local
    ports:
      - "8082:80"
      - "2020:2019"
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      MERCURE_SUBSCRIBER_JWT_KEY: "!ChangeThisMercureHubJWTSecretKey!"
      # No `metrics` here on purpose: this is Ember's hub-only mode. Add it to
      # the line below to get the Caddy tab back.
      GLOBAL_OPTIONS: "admin 0.0.0.0:2019"
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        subscriptions
    volumes:
      - mercure_data:/data
      - mercure_config:/config

volumes:
  mercure_data:
  mercure_config:
