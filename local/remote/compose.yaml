# FrankenPHP with an unpublished admin API, watched by an Ember daemon that
# serves remote TUIs over mTLS on :9191. Run `make certs` first.
services:
  frankenphp:
    image: dunglas/frankenphp:latest
    container_name: ember-remote-frankenphp
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ../frankenphp/public:/app/public
      - ../frankenphp/Caddyfile:/etc/frankenphp/Caddyfile

  ember:
    build: ../..
    container_name: ember-remote-daemon
    depends_on:
      - frankenphp
    ports:
      - "9191:9191"
    volumes:
      - ./certs:/certs:ro
    command:
      - --daemon
      - --expose=:9191
      - --addr=http://frankenphp:2019
      - --serve-remote
      - --expose-client-ca=/certs/ca.pem
      - --expose-cert=/certs/server.pem
      - --expose-key=/certs/server-key.pem
      - --log-listen=ember:9210
